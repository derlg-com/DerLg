# Second, isolated Postgres + Redis stack for `apps/` (ports 3005/3006).
# Runs ALONGSIDE the existing derlg-mvp stack (55433/56380) — different host
# ports, container names, and volumes so nothing is killed.
services:
  postgres:
    image: postgres:16-alpine
    container_name: derlg-apps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: derlg
      POSTGRES_PASSWORD: derlg_dev_password
      POSTGRES_DB: derlg
    ports:
      - '55435:5432'
    volumes:
      - derlg_apps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U derlg -d derlg']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: derlg-apps-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56382:6379'
    volumes:
      - derlg_apps_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  derlg_apps_pgdata:
  derlg_apps_redisdata: