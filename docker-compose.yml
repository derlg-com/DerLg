# DerLg local stack.
#
# `docker compose up --build` brings up Postgres, Redis, the NestJS API and the
# Next.js web app. Ports are deliberately non-default: 5432/6379/3100/3101 are
# already taken by the older project on this machine (see RAYU.md).
#
# The API applies pending Prisma migrations on every start, so a fresh clone
# is schema-ready without a manual `migrate`. Seed the catalogue once with:
#   docker compose exec api npm run db:seed
# (add `-- --upload-r2` once R2 is configured — see apps/api/.env.example)
#
# Caveat: the web container's server-side catalogue fetch uses
# NEXT_PUBLIC_API_URL, which is baked at build time for the *browser*
# (http://localhost:3101). From inside the web container that host does not
# resolve to the API, so SSR catalogue reads degrade to "no featured trips"
# — the public pages already handle that gracefully. Client-side fetching and
# the whole booking funnel are unaffected.
services:
  postgres:
    image: postgres:16-alpine
    container_name: derlg-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: derlg
      POSTGRES_PASSWORD: derlg_dev_password
      POSTGRES_DB: derlg
    ports:
      - '55433:5432'
    volumes:
      - derlg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U derlg -d derlg']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: derlg-mvp-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '56380:6379'
    volumes:
      - derlg_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: derlg-mvp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3101'
      # Inside the compose network the DB/Redis are reached by service name.
      DATABASE_URL: postgresql://derlg:derlg_dev_password@postgres:5432/derlg?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3100
      # Dev-only secrets are fine for local bring-up; override in .env for real use.
      JWT_ACCESS_SECRET: dev-only-access-secret-do-not-use-in-production-32+
      JWT_REFRESH_SECRET: dev-only-refresh-secret-do-not-use-in-production-32+
      JWT_ACCESS_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: '30'
      # Optional services — leave blank; their endpoints return 503 until set.
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_PUBLISHABLE_KEY: ''
      OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
      OPENAI_API_KEY: ''
      OPENAI_MODEL: meta/llama-3.1-8b-instruct
      R2_ACCOUNT_ID: ''
      R2_ACCESS_KEY_ID: ''
      R2_SECRET_ACCESS_KEY: ''
      R2_BUCKET: ''
      R2_PUBLIC_BASE_URL: ''
    ports:
      - '3101:3101'

  web:
    build:
      context: ./apps/web
      args:
        # NEXT_PUBLIC_* are inlined at build time; this is the URL the *browser*
        # uses to reach the API (published on the host at 3101).
        NEXT_PUBLIC_API_URL: http://localhost:3101/v1
        NEXT_PUBLIC_SITE_URL: http://localhost:3100
    container_name: derlg-mvp-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: '3100'
      NEXT_PUBLIC_API_URL: http://localhost:3101/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    ports:
      - '3100:3100'

volumes:
  derlg_pgdata:
  derlg_redisdata: